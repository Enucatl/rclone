services:

  rclone:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-medium
    image: rclone/rclone:latest
    cpu_shares: 256
    container_name: rclone-webdav-service
    restart: unless-stopped
    volumes:
      - ./config:/config/rclone
      - rclone_cache:/data/cache
    labels:
      - "checkmk_monitor=true"
    environment:
      - B2_BUCKET_NAME
      - RCLONE_CONFIG_B2REMOTE_ACCOUNT
      - RCLONE_CONFIG_B2REMOTE_KEY
      - WEBDAV_USER
      - WEBDAV_PASS
    command:
      - serve
      - webdav
      - "b2remote:${B2_BUCKET_NAME}/rclone"
      - --addr=:8000
      - --user=${WEBDAV_USER}
      - --pass=${WEBDAV_PASS}
      - --vfs-cache-mode=full
      - --cache-dir=/data/cache
      - --vfs-cache-max-size=20G
    depends_on:
      - cloudflared

  cloudflared:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-small
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/tunnel_token
    secrets:
      - tunnel_token
    command: tunnel run
    labels:
      - "checkmk_monitor=true"

volumes:
  rclone_cache:

secrets:
  tunnel_token:
    file: ./secrets/tunnel_token
